name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-version: ${{ matrix.dependency-version }}

      - name: Run the test suite
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest

    name: Lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, mbstring
          coverage: none

      - name: Check the syntax of every file
        run: find src tests bin examples -name '*.php' -print0 | xargs -0 -n1 php -l

  static-analysis:
    runs-on: ubuntu-latest

    name: Static analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  composer:
    runs-on: ubuntu-latest

    name: Composer validate

    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate --strict

  database:
    runs-on: ubuntu-latest

    name: ${{ matrix.database }}

    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: outbox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run the test suite
        env:
          OUTBOX_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=outbox'
          OUTBOX_TEST_MYSQL_USER: root
          OUTBOX_TEST_MYSQL_PASSWORD: root
          OUTBOX_TEST_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=outbox'
          OUTBOX_TEST_PGSQL_USER: postgres
          OUTBOX_TEST_PGSQL_PASSWORD: postgres
        run: vendor/bin/phpunit --testsuite integration
